name: Daily Instagram Post

on:
  schedule:
    # Runs at both possible UTC offsets; the guard below chooses the one matching 8:00 AM Vancouver.
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Vancouver send window
        id: send-window
        run: |
          scheduled_hour="$(echo "${{ github.event.schedule }}" | awk '{print $2}')"
          target_utc_hour="$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; local_send = datetime.now(ZoneInfo("America/Vancouver")).replace(hour=8, minute=0, second=0, microsecond=0); print(str(int(local_send.astimezone(ZoneInfo("UTC")).strftime("%H"))))')"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$scheduled_hour" = "$target_utc_hour" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because cron UTC hour $scheduled_hour does not match today's 8 AM Vancouver UTC hour $target_utc_hour."
          fi

      - name: Setup Node.js
        if: steps.send-window.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Restore content memory
        if: steps.send-window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/thestatsandstacks-history
          key: thestatsandstacks-history-${{ github.run_id }}
          restore-keys: |
            thestatsandstacks-history-

      - name: Install dependencies
        if: steps.send-window.outputs.should_run == 'true'
        working-directory: platform
        run: npm ci

      - name: Run Daily Pipeline
        if: steps.send-window.outputs.should_run == 'true'
        working-directory: platform
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          WORKFLOW_TIME_ZONE: America/Vancouver
          CONTENT_HISTORY_PATH: /tmp/thestatsandstacks-history/content-history.json
          ZERO_COST_MODE: "true"
          FREE_IMAGE_GENERATION_ONLY: "true"
          ALLOW_PAID_IMAGE_GENERATION: "false"
          GEMINI_IMAGE_GENERATION_ENABLED: "false"
          ALLOW_GEMINI_IMAGE_API_SPEND: "false"
          CLOUDFLARE_WORKERS_AI_ENABLED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' && 'true' || 'false' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
          CLOUDFLARE_IMAGE_STEPS: "4"
          CLOUDFLARE_MAX_IMAGES_PER_RUN: "8"
          CLOUDFLARE_ALLOW_PAID_OVERAGE: "false"
          ENABLE_REDDIT_RESEARCH: "true"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: thestatsandstacks-content-research/1.0
          HOT_TOPIC_WATCHLIST: SNDK,WDC,MU,NVDA,AVGO,AMD,PLTR,APP,HOOD,COIN,MSTR,SMCI,TSLA,SOFI,RKLB,IONQ
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DELIVERY_EMAIL: ${{ secrets.DELIVERY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run daily

      - name: Upload generated post package
        if: steps.send-window.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: thestatsandstacks-post-package-${{ github.run_id }}
          path: /tmp/thestatsandstacks/**
          if-no-files-found: ignore
          retention-days: 7

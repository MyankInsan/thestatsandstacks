name: Daily Instagram Post

on:
  schedule:
    # Runs at possible UTC offsets for 7 AM, 9 AM, 11 AM, and 1 PM America/Vancouver (accounting for Daylight Saving Time changes).
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Vancouver send window
        id: send-window
        run: |
          scheduled_hour="$(echo "${{ github.event.schedule }}" | awk '{print $2}')"
          target_utc_hour_7am="$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; local_send = datetime.now(ZoneInfo("America/Vancouver")).replace(hour=7, minute=0, second=0, microsecond=0); print(str(int(local_send.astimezone(ZoneInfo("UTC")).strftime("%H"))))')"
          target_utc_hour_9am="$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; local_send = datetime.now(ZoneInfo("America/Vancouver")).replace(hour=9, minute=0, second=0, microsecond=0); print(str(int(local_send.astimezone(ZoneInfo("UTC")).strftime("%H"))))')"
          target_utc_hour_11am="$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; local_send = datetime.now(ZoneInfo("America/Vancouver")).replace(hour=11, minute=0, second=0, microsecond=0); print(str(int(local_send.astimezone(ZoneInfo("UTC")).strftime("%H"))))')"
          target_utc_hour_1pm="$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; local_send = datetime.now(ZoneInfo("America/Vancouver")).replace(hour=13, minute=0, second=0, microsecond=0); print(str(int(local_send.astimezone(ZoneInfo("UTC")).strftime("%H"))))')"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$scheduled_hour" = "$target_utc_hour_7am" ] || [ "$scheduled_hour" = "$target_utc_hour_9am" ] || [ "$scheduled_hour" = "$target_utc_hour_11am" ] || [ "$scheduled_hour" = "$target_utc_hour_1pm" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because cron UTC hour $scheduled_hour does not match today's Vancouver UTC hours ($target_utc_hour_7am, $target_utc_hour_9am, $target_utc_hour_11am, or $target_utc_hour_1pm)."
          fi

      - name: Setup Node.js
        if: steps.send-window.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        if: steps.send-window.outputs.should_run == 'true'
        working-directory: platform
        run: npm ci

      - name: Run Daily Pipeline
        if: steps.send-window.outputs.should_run == 'true'
        working-directory: platform
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-flash-latest
          WORKFLOW_TIME_ZONE: America/Vancouver
          CONTENT_HISTORY_PATH: content-history.json
          ZERO_COST_MODE: "true"
          ENABLE_REDDIT_RESEARCH: "true"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: thestatsandstacks-content-research/1.0
          HOT_TOPIC_WATCHLIST: SNDK,WDC,MU,NVDA,AVGO,AMD,PLTR,APP,HOOD,COIN,MSTR,SMCI,TSLA,SOFI,RKLB,IONQ
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DELIVERY_EMAIL: ${{ secrets.DELIVERY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run daily

      - name: Commit and push content history changes
        if: steps.send-window.outputs.should_run == 'true' && success()
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add platform/content-history.json
          git commit -m "Update content history [skip ci]" || echo "No changes to commit"
          git push

      - name: Upload generated post package
        if: steps.send-window.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: thestatsandstacks-post-package-${{ github.run_id }}
          path: /tmp/thestatsandstacks/**
          if-no-files-found: ignore
          retention-days: 7

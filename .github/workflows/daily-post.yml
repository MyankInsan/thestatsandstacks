name: Daily Instagram Post

on:
  schedule:
    # Runs at both possible UTC offsets, then a Vancouver-time guard below keeps only 8:00 AM local.
    - cron: '0 15,16 * * *'
  workflow_dispatch: # Allows you to manually trigger from GitHub website

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Vancouver send window
        id: send-window
        run: |
          local_hour="$(TZ=America/Vancouver date +%H)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$local_hour" = "08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because Vancouver local hour is $local_hour, not 08."
          fi

      - name: Setup Node.js
        if: steps.send-window.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Restore content memory
        if: steps.send-window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/thestatsandstacks-history
          key: thestatsandstacks-history-${{ github.run_id }}
          restore-keys: |
            thestatsandstacks-history-

      - name: Install dependencies
        if: steps.send-window.outputs.should_run == 'true'
        working-directory: platform
        run: npm ci

      - name: Run Daily Pipeline
        if: steps.send-window.outputs.should_run == 'true'
        working-directory: platform
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-2.5-flash
          WORKFLOW_TIME_ZONE: America/Vancouver
          CONTENT_HISTORY_PATH: /tmp/thestatsandstacks-history/content-history.json
          ALLOW_PAID_IMAGE_GENERATION: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: gpt-image-1
          OPENAI_IMAGE_QUALITY: medium
          OPENAI_IMAGE_SIZE: 1024x1536
          ENABLE_REDDIT_RESEARCH: "true"
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: thestatsandstacks-content-research/1.0
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DELIVERY_EMAIL: ${{ secrets.DELIVERY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run daily

      - name: Upload generated slides
        if: always() && steps.send-window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thestatsandstacks-daily-output
          path: /tmp/thestatsandstacks
          if-no-files-found: warn
